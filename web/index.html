<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Демо-маркет · картка звернення</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1d1d1f; }
    textarea { width: 100%; min-height: 6rem; font: inherit; padding: .5rem; box-sizing: border-box; }
    button { margin-top: .5rem; padding: .5rem 1rem; font: inherit; cursor: pointer; }
    .card { margin-top: 1rem; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; }
    .card dt { font-weight: 600; margin-top: .5rem; }
    .card dd { margin: 0; white-space: pre-wrap; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Картка звернення</h1>
  <p class="muted">З уроку 3 логіка картки живе в Python-сервісі. Сторінка тільки надсилає текст на <code>POST /api/card</code>. Ключів у браузері нема й не буде.</p>

  <label for="ticket">Текст звернення клієнта</label>
  <textarea id="ticket">Не отримав посилку, замовлення DEMO-1042</textarea>
  <button id="make">Зробити картку</button>

  <div id="out" class="card" hidden></div>

  <script>
    const LABELS = { order_id: "номер замовлення", amount: "сума" };

    function formatKop(kop) {
      const sign = kop < 0 ? "-" : "";
      const abs = Math.abs(kop);
      const hryvni = Math.floor(abs / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      return `${sign}${hryvni},${String(abs % 100).padStart(2, "0")} грн`;
    }

    function rowsFor(card) {
      if (card.status === "empty_input") return [["Статус", "Порожнє звернення: картку не створено."]];
      const rows = [
        ["Статус", card.status],
        ["Номер замовлення", card.order_id || "Номер не надано"],
        ["Чого бракує", card.missing.length ? card.missing.map(m => LABELS[m] || m).join(", ") : "нічого"],
      ];
      if (card.category) rows.push(["Категорія", card.category]);
      if (card.amount_kop !== null && card.amount_kop !== undefined) rows.push(["Сума", formatKop(card.amount_kop)]);
      if (card.checks && Object.keys(card.checks).length) {
        rows.push(["Перевірки", Object.entries(card.checks).map(([k, v]) => `${k}: ${v}`).join("\n")]);
      }
      if (card.draft_reply) rows.push(["Чернетка відповіді", card.draft_reply]);
      return rows;
    }

    function render(rows) {
      const out = document.getElementById("out");
      out.hidden = false;
      out.replaceChildren();
      const dl = document.createElement("dl");
      for (const [k, v] of rows) {
        const dt = document.createElement("dt"); dt.textContent = k;
        const dd = document.createElement("dd"); dd.textContent = v;
        dl.append(dt, dd);
      }
      out.append(dl);
    }

    document.getElementById("make").addEventListener("click", async () => {
      const text = document.getElementById("ticket").value;
      try {
        const res = await fetch("/api/card", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const card = await res.json();
        const rows = rowsFor(card);
        if (card.order_id) {
          const rep = await fetch("/api/repeats?order_id=" + encodeURIComponent(card.order_id));
          if (rep.ok) rows.push(["Повторних звернень за 30 днів", String((await rep.json()).repeats)]);
        }
        render(rows);
      } catch (err) {
        render([["Сервіс недоступний", "Запусти в терміналі: uv run fastapi dev support/server.py\nі відкрий http://127.0.0.1:8000\n(" + err.message + ")"]]);
      }
    });
  </script>
</body>
</html>
