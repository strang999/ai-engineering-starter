[project]
name = "ai-engineering-starter"
version = "1.0.0"
description = "Starter repo for the free course «AI Engineering з нуля»: Демо-маркет support desk, mock-first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "fastapi[standard]>=0.115",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.8"]
# Local embeddings for lesson 10 (the multilingual-e5-small model, about 470 MB, downloads on first use)
rag-local = ["sentence-transformers>=5"]
# Live providers (lesson 6). Mock mode needs none of them.
anthropic = ["anthropic>=2.3"]
openai = ["openai>=3.37"]
gemini = ["google-genai>=2.33"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
