[project]
name = "ai-engineering-starter"
version = "1.0.0"
description = "Starter repo for the free course «AI Engineering з нуля»: Демо-маркет support desk, mock-first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
